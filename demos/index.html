<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RadiusJS examples</title>
  <script>
    (function () {
      var vv = window.visualViewport;
      var h = (vv && vv.height) || window.innerHeight;
      var top = (vv && vv.offsetTop) || 0;
      if (h) document.documentElement.style.setProperty('--g-vvh', Math.round(h) + 'px');
      document.documentElement.style.setProperty('--g-vv-top', Math.round(top) + 'px');
    })();
  </script>
  <meta name="description" content="Radius diagram examples — categorized gallery, diagram-first preview, styling playground." />
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <div class="gallery" id="gallery">
    <header class="gallery-top">
      <button
        type="button"
        class="nav-toggle"
        id="nav-toggle"
        aria-expanded="false"
        aria-controls="gallery-nav-wrap"
      >
        <span class="nav-toggle-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        Menu
      </button>
      <div class="brand">RadiusJS <span>examples</span></div>
      <div class="meta">
        v<span id="gallery-version">0.5.0</span>
        · <a href="../RADIUS.md">RADIUS.md</a>
        · static GitHub Pages ready
      </div>
    </header>

    <div class="nav-backdrop" id="nav-backdrop" hidden></div>

    <aside class="gallery-nav" id="gallery-nav-wrap" aria-label="Example categories">
      <div class="nav-drawer-head">
        <strong>Examples</strong>
        <button type="button" class="sheet-close" id="nav-close">Close</button>
      </div>
      <input
        class="nav-search"
        id="nav-search"
        type="search"
        placeholder="Filter examples…"
        autocomplete="off"
      />
      <div id="gallery-nav"></div>
    </aside>

    <main class="gallery-stage">
      <div class="stage-head">
        <div class="stage-titles">
          <h1 id="stage-title">Loading…</h1>
          <p id="stage-blurb"></p>
        </div>
        <button
          type="button"
          class="style-toggle"
          id="style-toggle"
          hidden
          aria-expanded="false"
          aria-controls="play-controls"
        >Style</button>
      </div>
      <div class="stage-body">
        <iframe
          class="stage-frame"
          id="stage-frame"
          title="Diagram preview"
          loading="lazy"
        ></iframe>

        <div class="stage-panel" id="stage-playground" aria-label="Styling playground">
          <div class="play-layout">
            <div class="play-preview">
              <div id="play-mount" class="radius-mount" data-fit-board="host"></div>
              <div class="play-error" id="play-error" role="alert"></div>
            </div>
            <div class="play-controls" id="play-controls"></div>
            <details class="play-source">
              <summary>What the AI writes</summary>
              <pre id="play-source-pre"></pre>
            </details>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="gallery.js"></script>
</body>
</html>
