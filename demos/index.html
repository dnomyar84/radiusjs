<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radius examples</title>
  <meta name="description" content="Radius diagram examples — categorized gallery, diagram-first preview, styling playground." />
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <div class="gallery" id="gallery">
    <header class="gallery-top">
      <div class="brand">Radius <span>examples</span></div>
      <div class="meta">
        v<span id="gallery-version">0.5.0</span>
        · <a href="../RADIUS.md">RADIUS.md</a>
        · <a href="./">demos/</a>
      </div>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle categories">Categories</button>
    </header>

    <aside class="gallery-nav" id="gallery-nav-wrap" aria-label="Example categories">
      <input
        class="nav-search"
        id="nav-search"
        type="search"
        placeholder="Filter examples…"
        autocomplete="off"
      />
      <div id="gallery-nav"></div>
    </aside>

    <main class="gallery-stage">
      <div class="stage-head">
        <h1 id="stage-title">Loading…</h1>
        <p id="stage-blurb"></p>
      </div>
      <div class="stage-body">
        <iframe
          class="stage-frame"
          id="stage-frame"
          title="Diagram preview"
          loading="lazy"
        ></iframe>

        <div class="stage-panel" id="stage-playground" aria-label="Styling playground">
          <div class="play-layout">
            <div class="play-controls" id="play-controls"></div>
            <div class="play-preview">
              <div id="play-mount" class="radius-mount"></div>
              <div class="play-error" id="play-error" role="alert"></div>
              <details class="play-source">
                <summary>What the AI writes</summary>
                <pre id="play-source-pre"></pre>
              </details>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="gallery.js"></script>
</body>
</html>
